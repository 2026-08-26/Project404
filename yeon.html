<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .arrow{
            color: red;
            font-weight: 700;
        }
        p{
            font-size: small;
            height: 10px;
        }
    </style>
</head>
<body>
    <p>내 파일</p>
    <p class = "arrow">↓</p>
    <p>git add 파일명</p>
    <p>or git add.(전체)</p>
    <p class = "arrow">↓</p>
    <p>커밋준비</p>
    <p class = "arrow">↓</p>
    <p>git commit-m "메시지"</p>
    <p class = "arrow">↓</p>
    <p>내 컴퓨터의 Git 저장소에 버전 저장</p>
    <p class = "arrow">↓</p>
    <p>git push origin master</p>
    <p class = "arrow">↓</p>
    <p>GitHub에 업로드</p>
</body>
</html>
